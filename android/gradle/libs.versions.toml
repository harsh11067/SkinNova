# Pinned 2026-10-05. AGP/Gradle as google-ai-edge/gallery; Kotlin 2.4 because litertlm-android 0.17.1 ships Kotlin 2.4 metadata.
[versions]
agp = "9.0.1"
kotlin = "2.4.20"
ksp = "2.3.6"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2026.02.00"
navigation = "2.8.9"
serializationJson = "1.7.3"
coroutines = "1.11.0"
litertlm = "0.17.1"
litert = "2.2.0"
cameraX = "1.4.2"
opencv = "4.12.0"
exifinterface = "1.4.1"
room = "2.8.5"
work = "2.10.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
